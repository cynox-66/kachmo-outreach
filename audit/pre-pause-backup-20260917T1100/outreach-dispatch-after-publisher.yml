name: Timezone Outreach Dispatcher

on:
  # ==========================================================================
  # AUTOMATED DISPATCH IS PAUSED. THIS IS AN INTENTIONAL SAFETY PAUSE.
  #
  # Postgres became canonical at cutover (database/CUTOVER_STATE.json). The
  # hosted application records suppression in Postgres, but this workflow runs
  # scripts/cron-dispatch.ts, which reads the committed database/suppression.json.
  # The ADR-010 publisher that would copy Postgres suppression into that file
  # HAS NO EXECUTOR YET. Suppression synchronisation does not exist today.
  #
  # An opt-out can therefore sit in Postgres and never reach the artifact this
  # dispatcher checks, so an automated run could email someone who asked not to
  # be contacted. The schedule below is disabled until that publisher exists.
  #
  # TO RESUME: set "paused": false in OUTREACH_PAUSE.json AND uncomment the
  # three cron lines below. Do neither until suppression actually publishes.
  #
  # schedule:
  #   # Monday through Thursday (1-4):
  #   # 08:00 UTC -> 09:00 AM London (UK) / 10:00 AM Berlin (EU)
  #   - cron: '0 8 * * 1-4'
  #   # 13:30 UTC -> 09:30 AM New York (EST) / Toronto (EDT)
  #   - cron: '30 13 * * 1-4'
  #   # 16:30 UTC -> 09:30 AM San Francisco (PST) / Los Angeles
  #   - cron: '30 16 * * 1-4'
  # ==========================================================================
  workflow_dispatch:
    inputs:
      force:
        description: 'Force dispatch regardless of local timezone window'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry run (simulate without sending)'
        required: false
        default: false
        type: boolean
      acknowledge_stale_suppression:
        description: 'Send anyway, accepting that Postgres suppression may not be in database/suppression.json'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Outreach pause gate (POST_CUTOVER suppression)
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          ACK: ${{ inputs.acknowledge_stale_suppression }}
        run: |
          node -e '
          const fs = require("fs");
          const f = "OUTREACH_PAUSE.json";
          if (!fs.existsSync(f)) { console.log("No " + f + "; automated dispatch is not paused."); process.exit(0); }
          const p = JSON.parse(fs.readFileSync(f, "utf-8"));
          if (p.paused !== true) { console.log(f + " records paused=false; dispatch may proceed."); process.exit(0); }
          console.log("=========================================================");
          console.log("AUTOMATED OUTREACH DISPATCH IS PAUSED.");
          console.log("This is an INTENTIONAL SAFETY PAUSE, not a failure.");
          console.log("Reason: " + p.reason);
          console.log("Blocked until: " + p.unblockedBy);
          console.log("=========================================================");
          console.log(p.note);
          if (process.env.DRY_RUN === "true") { console.log("\nDry run requested: nothing can be sent. Continuing."); process.exit(0); }
          if (process.env.ACK === "true") { console.log("\nOperator explicitly acknowledged the stale-suppression risk. Continuing."); process.exit(0); }
          console.error("\nRefusing to dispatch: suppression recorded in Postgres may be absent from database/suppression.json.");
          process.exit(1);
          '

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # ── The safety sequence. Every step before SEND fails the job rather than continuing. ──────────────
      #
      #   publish suppression  ->  verify the artifact  ->  dispatch
      #
      # Postgres is canonical for suppression; the dispatcher below reads the committed
      # database/suppression.json. These two steps are what make that file trustworthy at the moment of
      # sending. If Postgres is unreachable, if the artifact is stale, malformed, or holds an entry nobody
      # can account for, verification exits non-zero and NOTHING IS SENT.
      - name: Publish suppression from Postgres
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KACHMO_NO_LOCAL_ENV: '1'
        run: npm --prefix os run suppression:publish -- --apply

      - name: Verify suppression artifact matches Postgres
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KACHMO_NO_LOCAL_ENV: '1'
        run: npm --prefix os run suppression:verify

      - name: Run Timezone Outreach Dispatcher
        env:
          TITAN_SMTP_HOST: ${{ secrets.TITAN_SMTP_HOST || 'smtpout.secureserver.net' }}
          TITAN_SMTP_PORT: ${{ secrets.TITAN_SMTP_PORT || '587' }}
          TITAN_EMAIL: ${{ secrets.TITAN_EMAIL || 'studios@kachmo.in' }}
          TITAN_PASSWORD: ${{ secrets.TITAN_PASSWORD }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          npx tsx scripts/cron-dispatch.ts $ARGS

      - name: Commit and push updated queue and tracker
        run: |
          git config --global user.name "Kachmo Outreach Bot"
          git config --global user.email "studios@kachmo.in"
          git add scheduled-queue.json OUTREACH_TRACKER.md database/suppression.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-dispatch: updated outreach queue & tracker [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
